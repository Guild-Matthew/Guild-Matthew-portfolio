<div class="container py-4" *ngIf="set">
  <!-- Header -->
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-5">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary home-button" (click)="goHome()">
        <span class="home-icon">🏠</span> Home
      </button>
      <button class="btn btn-outline-primary btn-sm" (click)="toggleSelectionMode()">
        <span *ngIf="!selectionMode">☑ Select Cards</span>
        <span *ngIf="selectionMode">✕ Cancel</span>
      </button>
      <div *ngIf="selectionMode" class="form-check form-check-inline ms-2">
        <input class="form-check-input" type="checkbox" id="selectAll" 
               (change)="toggleSelectAll($event)" 
               [checked]="selectedCards.size === set.cards.length && set.cards.length > 0">
        <label class="form-check-label" for="selectAll">Select All</label>
      </div>
      <button *ngIf="selectionMode && selectedCards.size > 0" 
              class="btn btn-danger btn-sm ms-2" 
              (click)="deleteSelected()">
        🗑 Delete Selected ({{ selectedCards.size }})
      </button>
    </div>
    <div class="d-flex gap-3">
      <button class="btn btn-success btn-lg" (click)="goLearn()">📖 Learn</button>
      <button class="btn btn-info btn-lg" (click)="goMatch()">🧩 Match</button>
      <button class="btn btn-warning btn-lg" (click)="goTest()">📝 Test</button>
    </div>
  </div>

  <!-- Add Single Card -->
  <div class="card mb-5 p-4">
    <h5 class="mb-3">✏️ Add a new card</h5>
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label for="frontInput" class="visually-hidden">Front</label>
        <input id="frontInput" class="form-control" placeholder="Front" [(ngModel)]="newCard.front" title="Front of the card">
      </div>
      <div class="col-md-5">
        <label for="backInput" class="visually-hidden">Back</label>
        <input id="backInput" class="form-control" placeholder="Back" [(ngModel)]="newCard.back" title="Back of the card">
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" (click)="addCard()">+ Add</button>
      </div>
    </div>
  </div>

  <!-- Bulk Upload -->
  <div class="card mb-5 p-4">
    <h5 class="mb-3">📤 Bulk upload</h5>
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label for="fileInput" class="visually-hidden">Choose file</label>
        <input id="fileInput" type="file" class="form-control" (change)="onFileSelected($event)" accept=".pdf,.docx,.txt" title="Choose a file to upload">
        <small class="text-muted" *ngIf="bulkFile">{{ bulkFile.name }}</small>
      </div>
      <div class="col-md-3">
        <label for="delimiterInput" class="visually-hidden">Delimiter</label>
        <select id="delimiterInput" class="form-control" [(ngModel)]="bulkDelimiter" title="Delimiter character">
          <option value="auto">Auto-detect</option>
          <option value="\t">Tab</option>
          <option value=" - ">Dash ( - )</option>
          <option value=",">Comma</option>
          <option value=";">Semicolon</option>
          <option value="|">Pipe</option>
          <option value=": ">Colon+space</option>
        </select>
      </div>
      <div class="col-md-5 d-flex align-items-end gap-3">
        <div class="flex-grow-1">
          <label for="maxCardsInput" class="visually-hidden">Max cards</label>
          <input id="maxCardsInput" type="number" class="form-control" placeholder="Max cards (0=all)" [(ngModel)]="bulkCount" title="Maximum number of cards to create">
        </div>
        <button class="btn btn-success upload-button" (click)="uploadBulk()" [disabled]="isUploading">
          <span *ngIf="!isUploading">↑ Upload</span>
          <span *ngIf="isUploading">⏳ Uploading...</span>
        </button>
      </div>
    </div>
    <small class="text-muted mt-3 d-block">
      Supported: PDF, Word (.docx), plain text.
      Each line: front + delimiter + back (e.g., "A - a" or "A→B")
    </small>
  </div>

  <!-- Card Grid -->
  <div class="row g-5">
    <div class="col-md-4 col-lg-3 card-col" *ngFor="let card of set.cards; trackBy: trackByCardId">
      <div class="card h-100 p-4">
        <div class="card-body">
          <div *ngIf="selectionMode" class="form-check mb-2">
            <input class="form-check-input" type="checkbox" 
                   [id]="'card-' + card.id" 
                   [checked]="selectedCards.has(card.id)"
                   (change)="toggleCardSelection(card.id, $event)"
                   title="Select this card">
            <label class="form-check-label" [for]="'card-' + card.id">Select</label>
          </div>
          <h6 class="card-label">Front</h6>
          <p class="fw-bold card-text">{{ card.front }}</p>
          <hr class="card-divider">
          <h6 class="card-label">Back</h6>
          <p class="card-text">{{ card.back }}</p>
        </div>
        <div class="card-actions mt-4" *ngIf="!selectionMode">
          <button class="btn btn-outline btn-sm flex-grow-1" (click)="editCard(card)">✎ Edit</button>
          <button class="btn btn-outline btn-sm btn-delete" (click)="deleteCard(card.id)" aria-label="Delete card">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="set.cards.length === 0" class="text-center py-5">
    <p class="text-muted">No cards in this set yet. Add your first one!</p>
  </div>
</div>
